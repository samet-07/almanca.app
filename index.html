<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WortMeister - Otonom Koç</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --warn: #eab308; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    .container { padding: 20px; max-width: 650px; margin: auto; }
    /* Otonom Paneli */
    .auto-coach-panel { background: #1e3a8a; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--accent); }
    .status-pill { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 11px; background: var(--warn); color: #000; font-weight: bold; }
    
    /* Mevcut Bileşenler */
    .word-card { background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #64748b; }
    .word-card.needs-review { border-left-color: var(--warn); }
    
    .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1e293b; display: flex; border-top: 1px solid #334155; }
    .nav-btn { flex: 1; border: none; background: none; color: #94a3b8; font-size: 13px; font-weight: bold; cursor: pointer; }
    .nav-btn.active { color: var(--accent); border-top: 2px solid var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div id="coach-tab" class="auto-coach-panel">
      <h3>🤖 Otonom Koç Tavsiyesi</h3>
      <p id="coach-advice" style="font-size: 14px; margin-top: 10px;">Verileriniz analiz ediliyor...</p>
    </div>
    
    <div id="word-list"></div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="location.reload()">Yenile</button>
  </div>

  <script>
    let words = [];

    // OTONOM ANALİZ VE GÜNCELLEME (Gemini Beyni)
    async function autonomousUpdate() {
      if (words.length === 0) return;
      
      // Performans Analizi
      const needsReview = words.filter(w => w.wrongCount > w.correctCount);
      const adviceElement = document.getElementById('coach-advice');
      
      if (needsReview.length > 0) {
        const word = needsReview[0].word;
        adviceElement.innerHTML = `<strong>Tavsiye:</strong> "${word}" kelimesinde zorlanıyorsun. Lütfen bugün buna özel odaklan.`;
        // Otonom olarak durumu güncelle
        words.forEach(w => {
           if(w.wrongCount > w.correctCount) w.status = 'needs-review';
           else w.status = 'known';
        });
      } else {
        adviceElement.innerHTML = "Harika gidiyorsun! Bugün yeni kelimeler eklemeye hazır görünüyorsun.";
      }
      
      await saveWords();
      renderWords();
    }

    // Firebase'den Veri Çekme (Senkronizasyon)
    async function syncWithFirebase() {
      const dbUrl = (localStorage.getItem('wm_db_url') || '').trim().replace(/\/$/, "");
      if(!dbUrl) return;

      try {
        const res = await fetch(`${dbUrl}/words.json`);
        const data = await res.json();
        if(data) {
          words = Array.isArray(data) ? data : Object.values(data);
          autonomousUpdate(); // Veriyi çeker çekmez otonom analiz yap
        }
      } catch(e) {}
    }

    async function saveWords() {
      localStorage.setItem('wm_words', JSON.stringify(words));
      const dbUrl = (localStorage.getItem('wm_db_url') || '').trim().replace(/\/$/, "");
      if(dbUrl) {
        await fetch(`${dbUrl}/words.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(words)
        });
      }
    }

    function renderWords() {
      const list = document.getElementById('word-list');
      list.innerHTML = words.map(w => `
        <div class="word-card ${w.status === 'needs-review' ? 'needs-review' : ''}">
          <strong>${w.word}</strong> ${w.status === 'needs-review' ? '<span class="status-pill">TEKRARLA</span>' : ''}
          <p>${w.tr}</p>
        </div>
      `).join('');
    }

    window.onload = syncWithFirebase;
  </script>
</body>
</html>
